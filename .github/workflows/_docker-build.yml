name: _Docker Build and Push to GHCR

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      tag:
        required: false
        type: string
        default: 'latest'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Needed to push to GHCR

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # This ensures the image goes to the QuickHaulTransits organization
          tags: ghcr.io/quickhaultransits/${{ inputs.image-name }}:${{ inputs.tag }}
